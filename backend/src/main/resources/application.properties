spring.config.import=optional:file:${user.dir}/.env,optional:file:${user.dir}/backend/.env

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onlinecompiler}}
spring.datasource.username=${DB_USERNAME:usertest1}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}








compiler.allowed-origins=${COMPILER_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173}




spring.application.name=tavqen-compiler-service
server.port=${PORT:8080}
compiler.websocket-path=/ws/execute
compiler.jdoodle.enabled=true
compiler.jdoodle.auth-url=https://api.jdoodle.com/v1/auth-token
compiler.jdoodle.stomp-url=https://api.jdoodle.com/v1/stomp
compiler.jdoodle.connect-timeout-seconds=15
compiler.jdoodle.local-daily-credit-limit=20

# Add as many accounts as needed. Never commit real credentials.
compiler.jdoodle.accounts[0].id=account1
compiler.jdoodle.accounts[0].client-id=${JDOODLE_ACCOUNT_1_CLIENT_ID:}
compiler.jdoodle.accounts[0].client-secret=${JDOODLE_ACCOUNT_1_CLIENT_SECRET:}
compiler.jdoodle.accounts[0].enabled=true

compiler.jdoodle.accounts[1].id=account2
compiler.jdoodle.accounts[1].client-id=${JDOODLE_ACCOUNT_2_CLIENT_ID:}
compiler.jdoodle.accounts[1].client-secret=${JDOODLE_ACCOUNT_2_CLIENT_SECRET:}
compiler.jdoodle.accounts[1].enabled=${JDOODLE_ACCOUNT_2_ENABLED:true}

compiler.jdoodle.accounts[2].id=account3
compiler.jdoodle.accounts[2].client-id=${JDOODLE_ACCOUNT_3_CLIENT_ID:}
compiler.jdoodle.accounts[2].client-secret=${JDOODLE_ACCOUNT_3_CLIENT_SECRET:}
compiler.jdoodle.accounts[2].enabled=${JDOODLE_ACCOUNT_3_ENABLED:true}

compiler.jdoodle.accounts[3].id=account4
compiler.jdoodle.accounts[3].client-id=${JDOODLE_ACCOUNT_4_CLIENT_ID:}
compiler.jdoodle.accounts[3].client-secret=${JDOODLE_ACCOUNT_4_CLIENT_SECRET:}
compiler.jdoodle.accounts[3].enabled=${JDOODLE_ACCOUNT_4_ENABLED:true}

# Fill versionIndex values from JDoodle's current language/version reference.
compiler.jdoodle.languages.java.jdoodle-language=java
compiler.jdoodle.languages.java.version-index=${JDOODLE_JAVA_VERSION_INDEX:0}
compiler.jdoodle.languages.python.jdoodle-language=python3
compiler.jdoodle.languages.python.version-index=${JDOODLE_PYTHON_VERSION_INDEX:0}
compiler.jdoodle.languages.c.jdoodle-language=c
compiler.jdoodle.languages.c.version-index=${JDOODLE_C_VERSION_INDEX:0}
compiler.jdoodle.languages.cpp.jdoodle-language=cpp
compiler.jdoodle.languages.cpp.version-index=${JDOODLE_CPP_VERSION_INDEX:0}







# ==========================================
# AI PROVIDER CONFIGURATION - TEXT CHAT ONLY
# ==========================================

# 1. GOOGLE GEMINI
ai.providers.gemini.api-key=${GEMINI_API_KEY:}
ai.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

ai.providers.gemini.model=gemini-3.5-flash-lite
ai.providers.gemini.enabled=true


# 2. GROQ
ai.providers.groq.api-key=${GROQ_API_KEY:}
ai.providers.groq.base-url=https://api.groq.com/openai/v1
ai.providers.groq.model=openai/gpt-oss-120b
ai.providers.groq.enabled=true


# 3. OPENROUTER
ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.providers.openrouter.base-url=https://openrouter.ai/api/v1
ai.providers.openrouter.model=openrouter/free
ai.providers.openrouter.enabled=true


# 4. SAMBANOVA
ai.providers.sambanova.api-key=${SAMBANOVA_API_KEY:}
ai.providers.sambanova.base-url=https://api.sambanova.ai/v1
ai.providers.sambanova.model=DeepSeek-V3.1
ai.providers.sambanova.enabled=true


# 5. CLOUDFLARE WORKERS AI
ai.providers.cloudflare.api-key=${CLOUDFLARE_API_KEY:}
ai.providers.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
ai.providers.cloudflare.base-url=https://api.cloudflare.com/client/v4
ai.providers.cloudflare.model=@cf/openai/gpt-oss-120b
ai.providers.cloudflare.enabled=true


# ==========================================
# AI GENERAL SETTINGS
# ==========================================

# AI Response Configuration
ai.chat.max-output-tokens=16384
ai.chat.temperature=0.3
ai.chat.stream=false
ai.chat.timeout=180000
ai.chat.max-retries=3
